<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Cartilla Militar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d2b1f 0%, #1b4d2e 50%, #2e7d32 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        h1 {
            color: #1a3a2b;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            border-bottom: 2px solid #2e7d32;
            display: inline-block;
            padding-bottom: 5px;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        input:focus {
            outline: none;
            border-color: #2e7d32;
            background: white;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background: linear-gradient(135deg, #1b5e20 0%, #0d4710 100%);
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.3);
        }

        .mensaje {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            font-size: 12px;
            margin-top: 15px;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #888;
            text-align: center;
        }

        .required {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h1>📋 Registro Cartilla Militar</h1>
            <div class="subtitle">Servicio Militar Nacional</div>
            
            <form id="registroForm">
                <div class="form-group">
                    <label>📧 Correo Electrónico <span class="required">*</span></label>
                    <input type="email" id="correo" placeholder="correo@ejemplo.com" required>
                </div>
                
                <div class="form-group">
                    <label>🎂 Fecha de Nacimiento <span class="required">*</span></label>
                    <input type="date" id="fecha" required>
                </div>
                
                <button type="submit">Registrarse</button>
            </form>
            
            <div id="mensaje" class="mensaje"></div>
            <div class="footer">
                <p>Debes tener 18 años o más para registrarte</p>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById("registroForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            
            const correo = document.getElementById("correo").value;
            const fecha = document.getElementById("fecha").value;
            
            const mensajeDiv = document.getElementById("mensaje");
            mensajeDiv.className = "mensaje";
            mensajeDiv.innerHTML = '<div class="info">📤 Enviando solicitud...</div>';
            
            try {
                const response = await fetch("/registro", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        correo: correo,
                        fecha_nacimiento: fecha
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    mensajeDiv.innerHTML = `<div class="success">✅ ${data.mensaje}</div>`;
                } else {
                    mensajeDiv.innerHTML = `<div class="error">❌ ${data.detail}</div>`;
                }
            } catch (error) {
                console.error("Error:", error);
                mensajeDiv.innerHTML = '<div class="error">❌ Error de conexión. ¿El servidor está corriendo?</div>';
            }
        });
    </script>
</body>
</html>
