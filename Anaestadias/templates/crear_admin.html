<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Administrador</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a3a2b 0%, #2e7d32 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .register-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: #1a3a2b;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #2e7d32;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #1b5e20;
            transform: scale(1.02);
        }
        .success {
            color: #28a745;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .error {
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .login-link a {
            color: #2e7d32;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>📝 Registrar Administrador</h2>
        
        <form id="registerForm">
            <div class="form-group">
                <label>👤 Nombre</label>
                <input type="text" id="nombre" required placeholder="Nombre completo">
            </div>
            
            <div class="form-group">
                <label>📧 Correo Electrónico</label>
                <input type="email" id="correo" required placeholder="correo@empresa.com">
            </div>
            
            <div class="form-group">
                <label>🔒 Contraseña</label>
                <input type="password" id="password" required placeholder="••••">
            </div>
            
            <div class="form-group">
                <label>🔒 Confirmar Contraseña</label>
                <input type="password" id="confirm_password" required placeholder="••••">
            </div>
            
            <button type="submit">Registrarse</button>
            
            <div id="message"></div>
        </form>
        
        <div class="login-link">
            ¿Ya tienes cuenta? <a href="/login-admin-panel">Iniciar Sesión</a>
        </div>
    </div>
    
    <script>
        document.getElementById("registerForm").addEventListener("submit", async function(e) {
            e.preventDefault();
           
            
            const data = {
                nombre: document.getElementById("nombre").value,
                correo: document.getElementById("correo").value,
                password: password
            };
            
            try {
                const response = await fetch("/crear-admin", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    document.getElementById("message").innerHTML = '<div class="success">✅ Administrador registrado correctamente. Redirigiendo...</div>';
                    setTimeout(() => {
                        window.location.href = "/login-admin-panel";
                    }, 2000);
                } else {
                    const error = await response.json();
                    document.getElementById("message").innerHTML = `<div class="error">❌ ${error.detail || "Error al registrar"}</div>`;
                }
            } catch (error) {
                console.error("Error:", error);
                document.getElementById("message").innerHTML = '<div class="error">❌ Error de conexión. ¿El servidor está corriendo?</div>';
            }
        });
    </script>
</body>
</html>
